<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英文單字回音法練習</title><style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--mu:#6b6b72;--ln:rgba(0,0,0,.08);--ac:#0a84ff;--acs:rgba(10,132,255,.12);--seg:#e3e3e8;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ln:rgba(255,255,255,.1);--acs:rgba(10,132,255,.22);--seg:#2c2c2e;--sh:none}}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.in{max-width:640px;margin:auto;display:flex;flex-direction:column;gap:8px}
.tt{font-size:18px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--seg);border-radius:10px;padding:3px}
.seg button{flex:1 1 auto;min-width:52px;min-height:36px;border:0;border-radius:8px;font:inherit;font-size:15px;background:transparent;color:var(--tx)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.lr{display:flex;align-items:center;gap:8px}.lr .lb{font-size:13px;color:var(--mu);min-width:28px}.lr .seg{flex:1}
.w{max-width:640px;margin:auto;padding:14px 12px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.mu{color:var(--mu)}.hl{color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.b{flex:1 1 84px;min-height:48px;font:inherit;font-size:17px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-weight:600;box-shadow:var(--sh)}
.b.p{flex:2 1 130px;white-space:nowrap;background:var(--ac);color:#fff;border:0}
.cue{padding:12px;border-radius:12px;font-size:20px;font-weight:700;background:var(--acs)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--sh);border:1px solid var(--ln);padding:12px;min-height:64px;cursor:pointer;transition:background .2s}
.it.cur{background:var(--acs);border-color:var(--ac)}
.n{font-size:13px;color:var(--mu);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.mid{flex:1;min-width:0}
.l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.l1 b{font-size:20px}.l1 .ip{font-size:14px;color:var(--mu)}.l1 .z{font-size:15px}
.l2{font-size:14px;color:var(--mu);margin-top:3px;overflow-wrap:anywhere}
.spk{width:20px;height:20px;flex:none;color:var(--mu);opacity:.5}.it.pl .spk{color:var(--ac);opacity:1}
.it.pl .spk .wv{animation:pu .8s ease-in-out infinite alternate}@keyframes pu{from{opacity:.2}to{opacity:1}}
.go{flex:none;min-height:44px;min-width:64px;border:0;border-radius:10px;background:var(--acs);color:var(--ac);font:inherit;font-size:14px;font-weight:600}
.hid{display:none!important}
</style></head><body>
<div class="top"><div class="in"><div class="tt">英文單字回音法練習</div>
<div class="seg" id="view"></div><div class="seg" id="grp"></div><div class="lr"><span class="lb">語速</span><div class="seg" id="rate"></div></div></div></div>
<div class="w">
<div id="cv" style="display:flex;flex-direction:column;gap:14px">
<div class="card"><div class="mu" id="cnt" style="font-size:14px"></div>
<div id="word" style="font-size:44px;font-weight:800;word-break:break-word"></div>
<div class="mu" id="ipa" style="font-size:20px"></div><div id="zh" style="font-size:24px"></div><div style="height:1px;background:var(--ln);margin:4px 0"></div>
<div id="ph" style="font-size:28px;font-weight:700"></div><div class="mu" id="pz" style="font-size:19px"></div>
<div class="cue" id="cue">按「回音法播放」開始</div></div>
<div class="row"><button class="b" id="sw">念單字</button><button class="b" id="sp">念短語</button></div>
<div class="row"><button class="b" id="prev">‹ 上一個</button><button class="b p" id="play">▶ 回音法播放</button><button class="b" id="next">下一個 ›</button></div>

let g=0,i=0,rate=0.8,run=0,playing=false,view=0,pl=-1;const au=new Audio();au.preservesPitch=true;au.webkitPreservesPitch=true;

function list(){return W.slice(G[g][1],G[g][2])}
function seg(el,opts,sel,on){el.innerHTML="";opts.forEach((o,k)=>{const b=document.createElement("button");b.textContent=o;if(k===sel)b.className="on";b.onclick=()=>on(k);el.appendChild(b)})}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function buildList(){const o=G[g][1];$("lv").innerHTML=list().map((c,k)=>`<div class="it" data-k="${k}"><span class="n">${o+k+1}</span>${SPK}<div class="mid"><div class="l1"><b>${esc(c[0])}</b><span class="ip">${esc(c[1])}</span><span class="z">${esc(c[2])}</span></div><div class="l2">${esc(c[3])}・${esc(c[4])}</div></div><button class="go" data-go="${k}">練習 ▶</button></div>`).join("");
$("lv").querySelectorAll(".it").forEach(el=>el.onclick=e=>{const k=+el.dataset.k;if(e.target.closest(".go")){stop();i=k;setView(0);echo()}else rowPlay(k)});marks()}
function marks(scroll){$("lv").querySelectorAll(".it").forEach(el=>{const k=+el.dataset.k;el.classList.toggle("cur",playing&&k===i);el.classList.toggle("pl",k===pl)});

function render(){const l=list(),c=l[i];$("cnt").textContent=`${G[g][1]+i+1} / 26　（本組 ${i+1}/${l.length}）`;

function play1(key){return new Promise(res=>{let st=0,done=false;const fin=()=>{if(done)return;done=true;let d=st?(performance.now()-st)/1000:0;if(!(d>0.2))d=(au.duration||1)/rate;res(d)};

const wait=s=>new Promise(r=>setTimeout(r,s*1000));

async function rowPlay(k){stop();const r=run;pl=k;marks();const gi=G[g][1]+k;await play1(gi+"w");if(run!==r)return;await wait(0.3);if(run!==r)return;await play1(gi+"p");if(run===r){pl=-1;marks()}}
async function sil(d,tot,r){const e=Math.min(d,tot);cue("回音・心裡默念");await wait(e);if(run!==r)return;cue("跟讀・大聲說出來");await wait(Math.max(0,tot-e))}
async function echo(){const r=++run;playing=true;render();const ok=()=>run===r;const l=list();
while(ok()&&i<l.length){render();marks(true);const gi=G[g][1]+i;
for(let k=0;k<2;k++){cue("聽");hl("w");const d=await play1(gi+"w");hl(null);if(!ok())return;await sil(d,3,r);if(!ok())return}
cue("聽");hl("p");const d=await play1(gi+"p");hl(null);if(!ok())return;await sil(d,2*d+1,r);if(!ok())return;i++}
if(ok()){i=0;stop()}}
async function once(k){stop();const r=run;hl(k);await play1(G[g][1]+i+k);if(run===r)hl(null)}
$("sw").onclick=()=>once("w");$("sp").onclick=()=>once("p");
$("prev").onclick=()=>{stop();i=(i-1+list().length)%list().length;render()};$("next").onclick=()=>{stop();i=(i+1)%list().length;render()};
$("play").onclick=()=>playing?stop():echo();buildList();render();if(location.hash==="#list")setView(1);
</script></body></html>
