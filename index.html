<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文單字跟讀練習</title><style>
:root{--bg:#f6f7fb;--fg:#1b1d24;--mu:#6b7080;--cd:#fff;--ln:#e3e5ec;--ac:#2f6fed}
@media(prefers-color-scheme:dark){:root{--bg:#121318;--fg:#eceef4;--mu:#9aa0b0;--cd:#1d1f27;--ln:#2c2f3a;--ac:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.w{max-width:560px;margin:0 auto;padding:28px 16px 40px}h1{font-size:28px;margin:0 0 6px}.sub{color:var(--mu);font-size:16px;margin:0 0 22px;line-height:1.5}
a.card{display:block;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:20px;margin-bottom:14px;color:inherit;text-decoration:none;min-height:88px}
a.card:active{transform:scale(.98)}.t{display:flex;justify-content:space-between;align-items:center}.wk{font-size:24px;font-weight:800}
.n{background:var(--ac);color:#fff;border-radius:999px;padding:4px 12px;font-size:14px}.s{color:var(--mu);margin-top:10px;font-size:16px}.go{color:var(--ac);margin-top:10px;font-weight:600}
</style></head><body><div class="w"><h1>英文單字跟讀練習</h1><p class="sub">用史嘉琳教授的「回音法」：先聽、心裡回音、再大聲跟讀</p><div id="list"></div></div>
<script>
// 新增一週：在下面陣列加一筆即可（順序不拘，會自動把最新週排最上面）
const WEEKS = [
  { week: 2, file: "week02.html", count: 27, sample: ["criticism", "infamous", "as far as something is concerned", "in terms of"] },
  { week: 1, file: "week01.html", count: 26, sample: ["concession", "unfold", "witness", "harrowing"] },
];
document.getElementById("list").innerHTML = WEEKS.sort((a,b)=>b.week-a.week).map(w=>
 `<a class="card" href="${w.file}"><div class="t"><span class="wk">第 ${w.week} 週</span><span class="n">${w.count} 個單字</span></div><div class="s">${w.sample.join("、")}…</div><div class="go">開始練習 →</div></a>`).join("");
</script></body></html>
